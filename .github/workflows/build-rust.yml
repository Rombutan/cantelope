name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-pc-windows-gnu

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Stable Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    # FIX: Install a pre-compiled cross binary via cargo-binstall to save 2-3 minutes of CI time
    - name: Install Cross-RS
      run: |
        curl -L --proto '=https' --tlsv1.2 -sSf https://githubusercontent.com | sh
        cargo binstall --deploy-ids cross -y

      # ALTERNATIVE (If you strictly prefer Git compilation):
      # run: cargo install cross --git https://github.com

    - name: Run Build via Cross
      run: cross build --target ${{ matrix.target }} --release --verbose --features plot

    - name: Run Tests (AMD64 Linux Only)
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      run: cross test --target ${{ matrix.target }} --verbose --features plot
